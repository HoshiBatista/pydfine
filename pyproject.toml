[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydfine"
version = "0.1.0"
description = "Ultralytics-style, config-first Python library for the D-FINE real-time object detector."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "pydfine contributors" }]
keywords = ["d-fine", "object-detection", "detr", "computer-vision", "pytorch", "onnx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Typing :: Typed",
]

# Core install stays light: the config-first surface (DFINEConfig, presets, CLI
# `dfine models`) is pure-Python and needs no torch. Heavy deps live in extras so
# `pip install pydfine` doesn't force a torch build on users who only inspect configs.
dependencies = [
    "numpy>=1.21",
]

[project.optional-dependencies]
# Core runtime for the native (Path A) port — model build + inference.
torch = [
    "torch>=2.0.1",
    "torchvision>=0.15.2",
    "pillow>=9.0",
]
# Training + validation (Hungarian matcher, COCO eval, logging, yaml interop).
train = [
    "pydfine[torch]",
    "scipy>=1.10",
    "faster-coco-eval>=1.6.6",
    "torchmetrics>=1.0",  # segmentation mask AP (iou_type="segm")
    "tensorboard>=2.13",
    "matplotlib>=3.6",  # loss_curve.png training-progress plot
    "tqdm>=4.64",  # live training progress bar
    "pyyaml>=6.0",
    "opencv-python>=4.6",  # rasterize YOLO-Seg polygons to instance masks (segment training)
]
export = [
    "onnx>=1.14",
    "onnxruntime>=1.16",
    "onnxsim>=0.4",
]
# Video I/O for DFINE.predict_video (decode frames + write annotated mp4).
video = [
    "pydfine[torch]",
    "opencv-python>=4.6",
]
# Results interop: DataFrame + supervision.Detections converters.
interop = [
    "pandas>=1.3",
    "supervision>=0.18",
]
# Multi-object tracking on predict_video(track=True) — vendored ByteTrack (scipy only).
track = [
    "pydfine[video]",
    "scipy>=1.10",
]
# Auto-download instance-segmentation weights (dfine-seg-*) from Hugging Face.
hf = [
    "huggingface_hub>=0.20",
]
# Documentation site (MkDocs Material + mkdocstrings API reference from docstrings).
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]
dev = [
    "pydfine[torch]",  # torch/torchvision/pillow — so the full suite runs (not skips)
    "ruff==0.16.0",  # pinned to match .pre-commit-config + CI lint (format stability)
    "pytest>=7.0",
    "pytest-cov>=4.0",  # coverage reporting in CI
    "pre-commit>=3.5",
    "opencv-python-headless>=4.6",  # so predict_video tests run in CI (headless)
    "scipy>=1.10",  # Hungarian matcher — so criterion/matcher tests run in CI
    "faster-coco-eval>=1.6.6",  # COCO parser — so dataset tests run in CI
    "torchmetrics>=1.0",  # seg mask AP — so the seg val-eval test runs in CI
    "pyyaml>=6.0",  # data.yaml parsing — so yolo_to_coco tests run in CI
    "onnx>=1.14",  # ONNX export smoke test
    "onnxruntime>=1.16",  # run the exported graph in CI
    "pandas>=1.3",  # Results.to_pandas() interop test
    "supervision>=0.18",  # Results.to_supervision() interop test
    "huggingface_hub>=0.20",  # dfine-seg-* weight resolution/download tests
    "tqdm>=4.64",  # training progress bar — so the tqdm-path trainer tests run in CI
    "matplotlib>=3.6",  # val analytics (confusion matrix / PR curves) — so those tests run in CI
]

[project.urls]
Homepage = "https://github.com/HoshiBatista/pydfine"
Documentation = "https://hoshibatista.github.io/pydfine/"
Repository = "https://github.com/HoshiBatista/pydfine"
Issues = "https://github.com/HoshiBatista/pydfine/issues"
Upstream = "https://github.com/Peterande/D-FINE"
Paper = "https://arxiv.org/abs/2410.13842"

[project.scripts]
dfine = "dfine.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
include = ["dfine*"]

[tool.ruff]
line-length = 100
target-version = "py39"
# The upstream clone is a reference checkout, not our code — never lint/format it.
# force-exclude makes the exclude apply even when pre-commit passes explicit paths.
extend-exclude = ["D-FINE", "reference"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Silence known third-party noise from the legacy TorchScript-based ONNX export
# path (torch's own deprecations / tracer warnings — not ours). Everything else
# still surfaces so genuinely new warnings stay visible.
filterwarnings = [
    "ignore:.*legacy TorchScript-based ONNX export.*:DeprecationWarning",
    "ignore:.*torch\\.jit\\..*is deprecated.*:DeprecationWarning",
    "ignore:The feature will be removed.*:DeprecationWarning",
    "ignore:.*Constant folding.*:UserWarning",
    "ignore::torch.jit._trace.TracerWarning",
]
